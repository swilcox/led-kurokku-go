{{define "content"}}
<div class="breadcrumb">
  <a href="/">Instances</a> / <a href="/instances/{{.Instance.ID}}/config">{{.Instance.Name}}</a> / Raw JSON
</div>

<div class="header">
  <h1>{{.Instance.Name}} — Raw JSON</h1>
  <button class="btn-icon" onclick="toggleTheme()" title="Toggle dark/light mode">
    <svg class="weather-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
    </svg>
  </button>
</div>

<div id="form-errors">
{{if .Error}}
<div class="alert alert-error">{{.Error}}</div>
{{end}}
</div>

<div id="save-overlay" class="save-overlay" style="display:none">
  <div class="save-overlay-content">
    <div class="spinner"></div>
    <p>Saving configuration to Redis...</p>
  </div>
</div>
<form hx-post="/instances/{{.Instance.ID}}/config/json"
  hx-indicator="#save-overlay"
  hx-target="#form-errors"
  hx-swap="innerHTML">
  <div class="card">
    <div class="form-group">
      <label for="json">Configuration JSON</label>
      <textarea id="json" name="json" rows="20">{{.JSON}}</textarea>
    </div>
  </div>
  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Save to Redis</button>
    <a href="/instances/{{.Instance.ID}}/config" class="btn">Cancel</a>
  </div>
</form>
{{end}}
