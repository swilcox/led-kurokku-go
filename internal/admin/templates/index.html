{{define "content"}}
<div class="header">
  <h1>Kurokku Admin</h1>
  <div>
  <button class="btn-icon" onclick="toggleTheme()" title="Toggle dark/light mode">
    <svg class="weather-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
    </svg>
  </button>
  <button class="btn btn-primary"
    hx-get="/instances/new"
    hx-target="#instance-form-area"
    hx-swap="innerHTML">Add Instance</button>
  </div>
</div>

<div id="instance-form-area"></div>

<div class="card" id="instance-table" {{if not .Instances}}style="display:none"{{end}}>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Host</th>
        <th>Port</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="instance-list">
      {{range .Instances}}
      {{template "instance_row" .}}
      {{end}}
    </tbody>
  </table>
</div>
<div id="empty-state" class="empty-state" {{if .Instances}}style="display:none"{{end}}>
  <p>No instances configured yet.</p>
  <p>Add a Kurokku clock instance to get started.</p>
</div>
{{end}}
