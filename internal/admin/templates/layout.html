<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kurokku Admin</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
  <script>
    (function() {
      var t = localStorage.getItem('theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  <!-- Weather icon SVG symbols -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <symbol id="wi-sun" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
    </symbol>
    <symbol id="wi-cloud" viewBox="0 0 24 24">
      <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>
    </symbol>
    <symbol id="wi-rain" viewBox="0 0 24 24">
      <path d="M16 13v8M8 13v8M12 15v8"/>
      <path d="M17.2 9A7 7 0 0 0 3.3 12H2a5 5 0 0 0 5 5h9.5a4.5 4.5 0 1 0-.3-9z"/>
    </symbol>
    <symbol id="wi-snow" viewBox="0 0 24 24">
      <path d="M20 17.58A5 5 0 0 0 18 8h-1.26A8 8 0 1 0 4 16.25"/>
      <path d="M8 16h.01M8 20h.01M12 18h.01M12 22h.01M16 16h.01M16 20h.01"/>
    </symbol>
    <symbol id="wi-storm" viewBox="0 0 24 24">
      <path d="M19 16.9A5 5 0 0 0 18 7h-1.26a8 8 0 1 0-11.62 9"/>
      <polyline points="13 11 9 17 15 17 11 23"/>
    </symbol>
    <symbol id="wi-wind" viewBox="0 0 24 24">
      <path d="M9.59 4.59A2 2 0 1 1 11 8H2M12.59 19.41A2 2 0 1 0 14 16H2M17.73 7.73A2.5 2.5 0 1 1 19.5 12H2"/>
    </symbol>
    <symbol id="wi-fog" viewBox="0 0 24 24">
      <path d="M20 10h-1.26A8 8 0 0 0 3.3 12H2M3 16h18M3 20h14"/>
    </symbol>
    <symbol id="wi-partly-cloudy" viewBox="0 0 24 24">
      <path d="M12.4 2.3a5 5 0 0 1 2.3 9.4"/>
      <path d="M7.5 4.8l.7.7M2.3 9.3h1M4.1 4.1l.7.7"/>
      <path d="M16 13a4 4 0 0 0-7.5-2H8a3.5 3.5 0 0 0 0 7h8a3 3 0 1 0-.2-6z"/>
    </symbol>
  </svg>

  {{block "content" .}}{{end}}

  <script>
    function toggleTheme() {
      var html = document.documentElement;
      var current = html.getAttribute('data-theme');
      var next;
      if (current === 'light') next = 'dark';
      else if (current === 'dark') next = 'light';
      else next = window.matchMedia('(prefers-color-scheme: light)').matches ? 'dark' : 'light';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    }
  </script>
</body>
</html>
