services:
  valkey:
    image: valkey/valkey:8
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data

  kurokku:
    image: ghcr.io/swilcox/led-kurokku:latest
    restart: unless-stopped
    privileged: true
    user: root
    cap_add:
      - SYS_RAWIO
    devices:
      - "/dev/gpiomem:/dev/gpiomem"
      - "/dev/mem:/dev/mem"
      - "/dev/spidev0.0:/dev/spidev0.0"
      - "/dev/i2c-1:/dev/i2c-1"
    depends_on:
      - valkey
    environment:
      - REDIS_HOST=valkey
      - REDIS_PORT=6379
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro

  kurokku-admin:
    image: ghcr.io/swilcox/led-kurokku-admin:latest
    restart: unless-stopped
    depends_on:
      - valkey
    environment:
      - REDIS_HOST=valkey
      - REDIS_PORT=6379
    ports:
      - "8080:8080"
    volumes:
      - admin-data:/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    command: ["-store", "/data/kurokku-admin.json"]
    profiles:
      - admin

volumes:
  valkey-data:
  admin-data:
